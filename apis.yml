aid: crosslayer-labs
name: Crosslayer Labs
description: Crosslayer Labs is a network and web-infrastructure security company spun out of a
  Princeton University security research lab. Its founding team invented Multi-Perspective Issuance
  Corroboration (MPIC), an industry standard now required of every publicly-trusted Certificate
  Authority, which secures the issuance of every HTTPS certificate (~8 million per day). The company
  protects enterprises from website and API hijacks by discovering, analyzing, and continuously
  monitoring every layer of first- and third-party network infrastructure, correlating attack signals
  across the network stack for advanced threat detection and rapid mitigation.
